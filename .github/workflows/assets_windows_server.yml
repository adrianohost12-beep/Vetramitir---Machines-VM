name: Windows Server + Tailscale Setup

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: windows-latest

    steps:
      - name: Install Tailscale
        run: |
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile tailscale.msi
          Start-Process msiexec.exe -ArgumentList "/i tailscale.msi /quiet" -Wait

      - name: Connect Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          & "C:\Program Files\Tailscale IPN\tailscale.exe" up --authkey=$env:TS_AUTHKEY --hostname=WinServer2024

      - name: Create User + Show Info
        run: |
          $computerName = $env:COMPUTERNAME

          # pega IP do Tailscale
          $tsIP = & "C:\Program Files\Tailscale IPN\tailscale.exe" ip -4

          # cria senha aleatória
          $password = -join ((65..90 + 97..122 + 48..57) | Get-Random -Count 14 | ForEach-Object {[char]$_})

          $user = "RunnerMaty"

          net user $user $password /add

          Write-Output "=============================="
          Write-Output "SERVER NAME: $computerName"
          Write-Output "TAILSCALE IP: $tsIP"
          Write-Output "USER: $user"
          Write-Output "PASSWORD: $password"
          Write-Output "=============================="
