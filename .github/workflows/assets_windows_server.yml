name: Windows Server 2024 - Tailscale

on:
  workflow_dispatch:

jobs:
  windows-server:
    runs-on: windows-2025

    steps:
      - name: Install Tailscale
        shell: powershell
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          Write-Host "Installing Tailscale..."

          $installer = "$env:TEMP\tailscale-setup.exe"

          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" `
            -OutFile $installer

          Start-Process $installer -ArgumentList "/quiet" -Wait

          Write-Host "Tailscale installation completed."

      - name: Connect to Tailscale
        shell: powershell
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $tailscale up `
            --auth-key="$env:TS_AUTHKEY" `
            --hostname="Windows-Server-2024"

          Start-Sleep -Seconds 5

      - name: Get Tailscale Information
        shell: powershell
        run: |
          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          $hostname = (& $tailscale status --self=false 2>$null |
            Select-String "Windows-Server-2024").Line

          $ip = (& $tailscale ip -4).Trim()

          Write-Host ""
          Write-Host "===================================="
          Write-Host " WINDOWS SERVER 2024"
          Write-Host "===================================="
          Write-Host "Tailscale Name: Windows-Server-2024"
          Write-Host "Tailscale IP:   $ip"
          Write-Host "===================================="
