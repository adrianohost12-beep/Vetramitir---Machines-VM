name: Windows Server 2022 - Tailscale

on:
  workflow_dispatch:

jobs:
  windows-server:
    name: Windows Server 2022 Tailscale Server
    runs-on: windows-2022

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci

      - name: Show Runner Information
        shell: powershell
        run: |
          Write-Host "====================================="
          Write-Host " WINDOWS SERVER 2022 RUNNER"
          Write-Host "====================================="
          Write-Host "User: $env:USERNAME"
          Write-Host "Computer: $env:COMPUTERNAME"
          Write-Host "Runner OS: $env:RUNNER_OS"
          Write-Host "Runner Name: $env:RUNNER_NAME"
          Write-Host "Runner Architecture: $env:RUNNER_ARCH"
          Write-Host "====================================="

      - name: Tailscale Status
        shell: powershell
        run: |
          Write-Host "Tailscale Status:"
          tailscale status

          Write-Host ""
          Write-Host "Tailscale IP:"
          tailscale ip -4

      - name: Test Server Connection
        shell: powershell
        run: |
          Write-Host "Testing Tailscale..."
          tailscale version
          Write-Host "Server connection OK!"
