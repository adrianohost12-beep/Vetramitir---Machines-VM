name: Vetramitir Connect Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  server:
    name: Build Vetramitir Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm install

      - name: Build Server
        run: npm run build --if-present

      - name: Start Server
        run: |
          npm start > server.log 2>&1 &
          sleep 5

      - name: Server Completed
        run: |
          echo "======================================"
          echo " Vetramitir Connect Server"
          echo "======================================"
          echo "Server Status: ONLINE"
          echo "Server Address: $SERVER_URL"
          echo "======================================"
        env:
          SERVER_URL: https://your-server.example.com
